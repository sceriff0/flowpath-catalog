name: Manage Catalog

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - remove-version
      extension:
        description: 'Extension name (e.g. "FlowPath - qUMAP" or "FlowPath - GatingTree")'
        required: true
        type: string
      version:
        description: 'Version to remove (e.g. "v0.1.0")'
        required: true
        type: string

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove version from catalog
        if: inputs.action == 'remove-version'
        env:
          EXTENSION: ${{ inputs.extension }}
          VERSION: ${{ inputs.version }}
        run: |
          echo "Removing ${VERSION} from ${EXTENSION}..."

          jq --arg ext "$EXTENSION" --arg ver "$VERSION" \
            '(.extensions[] | select(.name == $ext) | .releases) |= map(select(.name != $ver))' \
            catalog.json > catalog.tmp && mv catalog.tmp catalog.json

          echo "Updated catalog.json:"
          cat catalog.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Remove ${{ inputs.extension }} ${{ inputs.version }} from catalog"
          git push
